<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 智能面试助手</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">AI 智能面试助手</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="展开导航">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="main-nav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link active" href="/">AI 问答</a></li>
        <li class="nav-item"><a class="nav-link" href="/interview">模拟面试</a></li>
        <li class="nav-item"><a class="nav-link" href="/bank">题库</a></li>
        <li class="nav-item"><a class="nav-link" href="/bank/new">添加题目</a></li>
        <li class="nav-item"><a class="nav-link" href="/quiz">模拟测试</a></li>
        <li class="nav-item" id="nav-stats"><a class="nav-link" href="/stats">统计</a></li>
        <li class="nav-item" id="nav-records"><a class="nav-link" href="/records">答题记录</a></li>
        <li class="nav-item" id="nav-profile"><a class="nav-link" href="/profile">个人中心</a></li>
      </ul>
      <a class="btn btn-outline-light btn-sm me-2 mt-2 mt-lg-0" id="nav-login" href="/login">登录</a>
      <a class="btn btn-light btn-sm me-2 mt-2 mt-lg-0" id="nav-register" href="/register">注册</a>
      <span class="navbar-text me-2" id="user-info">未登录</span>
      <button class="btn btn-outline-danger btn-sm mt-2 mt-lg-0" id="nav-logout" onclick="logout()">登出</button>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>AI 问答</span>
      <button class="btn btn-sm btn-outline-secondary" onclick="clearChat()">清空对话</button>
    </div>
    <div class="card-body">
      <div id="chat-area" class="mb-3" style="max-height: 480px; overflow-y: auto;">
        <div class="text-muted small">登录后即可和 AI 对话，它会记住上下文；未登录请先登录或注册。</div>
      </div>
      <textarea id="chat-input" class="form-control" rows="2" placeholder="输入你的问题，Enter 发送（Shift+Enter 换行）" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
      <button id="send-button" class="btn btn-success mt-2" onclick="sendMessage()">发送</button>
    </div>
  </div>
</div>

<!-- 未登录点击发送时弹出的登录提示框 -->
<div class="modal fade" id="login-required-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">请先登录才能使用 AI 问答</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
      </div>
      <div class="modal-body">AI 问答功能需要登录后才能使用，请先登录或注册账号。</div>
      <div class="modal-footer">
        <a class="btn btn-outline-secondary" href="/register">去注册</a>
        <a class="btn btn-primary" href="/login">去登录</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/common.js"></script>
<script>
// 多轮对话历史：每次发送时把完整历史带给 /ask，模型才能记住上下文；
// 历史按登录账号存进 localStorage，切到别的页面再回来会自动恢复气泡并续答
let chatHistory = [];

// 当前账号的存储键：对话按用户隔离，换账号登录看不到别人的历史
function chatKey() {
  const u = currentUser();
  return "interview_ai_chat_" + (u ? u.name : "guest");
}

// 把历史写入 localStorage（发送/收到消息后调用）
function saveChat() {
  try { localStorage.setItem(chatKey(), JSON.stringify(chatHistory)); } catch (e) {}
}

// 从 localStorage 读回历史；数据损坏时按空历史处理
function loadChat() {
  try {
    const arr = JSON.parse(localStorage.getItem(chatKey()) || "[]");
    chatHistory = Array.isArray(arr) ? arr : [];
  } catch (e) {
    chatHistory = [];
  }
}

// 往聊天区加一条消息气泡：用户消息蓝色靠右，AI 回复浅灰靠左
function addBubble(text, who) {
  const area = document.getElementById("chat-area");
  const bubble = document.createElement("div");
  if (who === "user") {
    bubble.className = "alert alert-primary mb-2 py-2 ms-auto";
  } else {
    bubble.className = "alert alert-secondary mb-2 py-2 me-auto";
  }
  bubble.style.maxWidth = "80%";
  bubble.style.whiteSpace = "pre-wrap";
  bubble.textContent = text;
  area.appendChild(bubble);
  area.scrollTop = area.scrollHeight;
}

// 发送一条消息：先入历史再请求，回答也写回历史
async function sendMessage() {
  // 未登录先弹出登录提示框，不允许使用 AI 问答
  if (!isLoggedIn()) {
    showLoginModal();
    return;
  }
  const input = document.getElementById("chat-input");
  const button = document.getElementById("send-button");
  const text = input.value.trim();
  if (text === "") return;
  chatHistory.push({ role: "user", content: text });
  saveChat();
  addBubble(text, "user");
  input.value = "";
  button.disabled = true;
  button.textContent = "AI 思考中……";
  // 先放一个空气泡，AI 回复会通过流式请求一个字一个字地写进这个气泡
  const area = document.getElementById("chat-area");
  const bubble = document.createElement("div");
  bubble.className = "alert alert-secondary mb-2 py-2 me-auto";
  bubble.style.maxWidth = "80%";
  bubble.style.whiteSpace = "pre-wrap";
  bubble.textContent = "AI 思考中……";
  area.appendChild(bubble);
  area.scrollTop = area.scrollHeight;
  try {
    let started = false;
    const answer = await ssePost("/ask/stream", { messages: chatHistory.slice() }, function (chunk) {
      if (!started) {
        bubble.textContent = "";
        started = true;
      }
      bubble.textContent += chunk;
      area.scrollTop = area.scrollHeight;
    });
    chatHistory.push({ role: "assistant", content: answer });
    saveChat();
  } catch (e) {
    bubble.textContent = "调用失败：" + e.message;
  } finally {
    button.disabled = false;
    button.textContent = "发送";
  }
}

// 清空对话历史与聊天区，并补回初始提示语；同时清掉本地保存的历史
function clearChat() {
  chatHistory = [];
  try { localStorage.removeItem(chatKey()); } catch (e) {}
  const area = document.getElementById("chat-area");
  area.innerHTML = "";
  const tip = document.createElement("div");
  tip.className = "text-muted small";
  tip.textContent = "登录后即可和 AI 对话，它会记住上下文；未登录请先登录或注册。";
  area.appendChild(tip);
}

// 页面加载时恢复历史对话：先把所有历史气泡画出来；
// 若最后一条是用户消息（说明 AI 回复还没写完就被切走），自动重新请求把回复续上
function restoreChat() {
  loadChat();
  chatHistory.forEach(function (m) {
    if (m && typeof m.content === "string" && m.content) {
      addBubble(m.content, m.role === "user" ? "user" : "ai");
    }
  });
  if (chatHistory.length > 0 && chatHistory[chatHistory.length - 1].role === "user" && isLoggedIn()) {
    resumeChat();
  }
}

// 续答：带着完整历史重新请求流式接口，AI 从上次没答完的问题继续回答
async function resumeChat() {
  const button = document.getElementById("send-button");
  const area = document.getElementById("chat-area");
  button.disabled = true;
  button.textContent = "AI 思考中……";
  const bubble = document.createElement("div");
  bubble.className = "alert alert-secondary mb-2 py-2 me-auto";
  bubble.style.maxWidth = "80%";
  bubble.style.whiteSpace = "pre-wrap";
  bubble.textContent = "AI 思考中……";
  area.appendChild(bubble);
  area.scrollTop = area.scrollHeight;
  try {
    let started = false;
    const answer = await ssePost("/ask/stream", { messages: chatHistory.slice() }, function (chunk) {
      if (!started) {
        bubble.textContent = "";
        started = true;
      }
      bubble.textContent += chunk;
      area.scrollTop = area.scrollHeight;
    });
    chatHistory.push({ role: "assistant", content: answer });
    saveChat();
  } catch (e) {
    bubble.textContent = "调用失败：" + e.message;
  } finally {
    button.disabled = false;
    button.textContent = "发送";
  }
}

// 弹出"请先登录"提示框
function showLoginModal() {
  const el = document.getElementById("login-required-modal");
  bootstrap.Modal.getOrCreateInstance(el).show();
}

// 页面打开时恢复历史对话（导航登录态由 common.js 末尾的 showUser() 恢复）
restoreChat();
</script>
</body>
</html>
