<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模拟面试 - AI 智能面试助手</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">AI 智能面试助手</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="展开导航">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="main-nav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="/">AI 问答</a></li>
        <li class="nav-item"><a class="nav-link active" href="/interview">模拟面试</a></li>
        <li class="nav-item"><a class="nav-link" href="/bank">题库</a></li>
        <li class="nav-item"><a class="nav-link" href="/bank/new">添加题目</a></li>
        <li class="nav-item"><a class="nav-link" href="/quiz">模拟测试</a></li>
        <li class="nav-item" id="nav-stats"><a class="nav-link" href="/stats">统计</a></li>
        <li class="nav-item" id="nav-records"><a class="nav-link" href="/records">答题记录</a></li>
        <li class="nav-item" id="nav-profile"><a class="nav-link" href="/profile">个人中心</a></li>
      </ul>
      <a class="btn btn-outline-light btn-sm me-2 mt-2 mt-lg-0" id="nav-login" href="/login">登录</a>
      <a class="btn btn-light btn-sm me-2 mt-2 mt-lg-0" id="nav-register" href="/register">注册</a>
      <span class="navbar-text me-2" id="user-info">未登录</span>
      <button class="btn btn-outline-danger btn-sm mt-2 mt-lg-0" id="nav-logout" onclick="logout()">登出</button>
    </div>
  </div>
</nav>

<div class="container py-4" style="max-width: 760px;">
  <div class="card mb-3">
    <div class="card-header">模拟面试设置</div>
    <div class="card-body d-flex gap-2">
      <input id="job-title" class="form-control" placeholder="输入面试岗位，例如：Python 后端开发工程师" onkeydown="if(event.key==='Enter'){startInterview();}">
      <button id="start-button" class="btn btn-primary flex-shrink-0" onclick="startInterview()">开始面试</button>
    </div>
  </div>

  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>面试对话</span>
      <button id="end-button" class="btn btn-sm btn-danger" onclick="endInterview()">结束面试并生成报告</button>
    </div>
    <div class="card-body">
      <div id="interview-area" class="mb-3" style="max-height: 420px; overflow-y: auto;">
        <div class="text-muted small">填写岗位名称后点击「开始面试」，AI 面试官会开始提问；登录后即可使用。</div>
      </div>
      <textarea id="answer-input" class="form-control" rows="2" placeholder="输入你的回答，Enter 发送（Shift+Enter 换行）" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAnswer();}"></textarea>
      <button id="send-button" class="btn btn-success mt-2" onclick="sendAnswer()">发送回答</button>
    </div>
  </div>

  <div id="interview-report" class="card mt-3 d-none">
    <div class="card-header">面试总结报告</div>
    <div class="card-body">
      <h5 class="mb-3">总分评价：<span id="report-score" class="badge bg-primary"></span></h5>
      <p class="mb-2"><strong>优点：</strong><span id="report-strengths"></span></p>
      <p class="mb-2"><strong>不足：</strong><span id="report-weaknesses"></span></p>
      <p class="mb-0"><strong>建议：</strong><span id="report-advice"></span></p>
    </div>
  </div>
</div>

<!-- 未登录点击时弹出的登录提示框 -->
<div class="modal fade" id="login-required-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">请先登录才能使用模拟面试</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
      </div>
      <div class="modal-body">模拟面试功能需要登录后才能使用，请先登录或注册账号。</div>
      <div class="modal-footer">
        <a class="btn btn-outline-secondary" href="/register">去注册</a>
        <a class="btn btn-primary" href="/login">去登录</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/common.js"></script>
<script>
// 面试对话历史：每次发送都把完整历史带给 /interview，面试官才能记住上下文；
// 历史按登录账号存进 localStorage，切到别的页面再回来会自动恢复气泡并续答
let interviewHistory = [];
let jobTitle = "";
let started = false;
// 面试回答计数器：只有真正点击过「发送回答」才算回答过，用于结束面试时的空回答拦截
let answeredCount = 0;
// 开始面试时写入历史的开场消息：恢复历史时跳过渲染，避免出现一条蓝色「用户气泡」
const OPENING = "面试开始，请先问我第一个问题";

// 当前账号的面试状态存储键：按用户隔离，换账号登录看不到别人的面试
function stateKey() {
  const u = currentUser();
  return "interview_ai_interview_" + (u ? u.name : "guest");
}

// 把整场面试状态（岗位/进行中标记/回答计数/完整历史）写入 localStorage
function saveState() {
  try {
    localStorage.setItem(stateKey(), JSON.stringify({
      jobTitle: jobTitle,
      started: started,
      answeredCount: answeredCount,
      interviewHistory: interviewHistory
    }));
  } catch (e) {}
}

// 从 localStorage 读回面试状态；数据损坏时保持默认空状态
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(stateKey()) || "null");
    if (s && typeof s === "object") {
      jobTitle = s.jobTitle || "";
      started = !!s.started;
      answeredCount = s.answeredCount || 0;
      interviewHistory = Array.isArray(s.interviewHistory) ? s.interviewHistory : [];
    }
  } catch (e) {}
}

// 往面试区加一条消息气泡：我的回答蓝色靠右，面试官提问浅灰靠左
function addBubble(text, who) {
  const area = document.getElementById("interview-area");
  const bubble = document.createElement("div");
  if (who === "user") {
    bubble.className = "alert alert-primary mb-2 py-2 ms-auto";
  } else {
    bubble.className = "alert alert-secondary mb-2 py-2 me-auto";
  }
  bubble.style.maxWidth = "80%";
  bubble.style.whiteSpace = "pre-wrap";
  bubble.textContent = text;
  area.appendChild(bubble);
  area.scrollTop = area.scrollHeight;
}

// 用流式方式向模拟面试官提问并逐字显示回复，返回完整回应文本；失败时气泡显示错误并抛出
async function askInterviewStream(body) {
  const area = document.getElementById("interview-area");
  const bubble = document.createElement("div");
  bubble.className = "alert alert-secondary mb-2 py-2 me-auto";
  bubble.style.maxWidth = "80%";
  bubble.style.whiteSpace = "pre-wrap";
  bubble.textContent = "面试官思考中……";
  area.appendChild(bubble);
  area.scrollTop = area.scrollHeight;
  try {
    let started = false;
    const full = await ssePost("/interview/stream", body, function (chunk) {
      if (!started) {
        bubble.textContent = "";
        started = true;
      }
      bubble.textContent += chunk;
      area.scrollTop = area.scrollHeight;
    });
    return full;
  } catch (e) {
    bubble.textContent = "调用失败：" + e.message;
    throw e;
  }
}

// 开始面试：保存岗位名称，清空历史，让面试官提出第一个问题
async function startInterview() {
  if (!isLoggedIn()) {
    showLoginModal();
    return;
  }
  const input = document.getElementById("job-title");
  jobTitle = input.value.trim();
  if (jobTitle === "") {
    alert("请先输入面试岗位名称");
    return;
  }
  const area = document.getElementById("interview-area");
  area.innerHTML = "";
  interviewHistory = [];
  answeredCount = 0;
  started = true;
  saveState();
  const button = document.getElementById("start-button");
  button.disabled = true;
  button.textContent = "面试官思考中……";
  addBubble("面试开始：你应聘的是「" + jobTitle + "」岗位，请等待面试官提问。", "ai");
  try {
    interviewHistory.push({ role: "user", content: OPENING });
    saveState();
    const answer = await askInterviewStream({ job_title: jobTitle, messages: interviewHistory.slice() });
    interviewHistory.push({ role: "assistant", content: answer });
    saveState();
  } catch (e) {
  } finally {
    button.disabled = false;
    button.textContent = "开始面试";
  }
}

// 发送回答：先入历史再请求，面试官的回应也写回历史
async function sendAnswer() {
  if (!isLoggedIn()) {
    showLoginModal();
    return;
  }
  if (!started) {
    alert("请先输入岗位并点击「开始面试」");
    return;
  }
  const input = document.getElementById("answer-input");
  const button = document.getElementById("send-button");
  const text = input.value.trim();
  if (text === "") return;
  interviewHistory.push({ role: "user", content: text });
  answeredCount++;
  saveState();
  addBubble(text, "user");
  input.value = "";
  button.disabled = true;
  button.textContent = "面试官思考中……";
  try {
    const answer = await askInterviewStream({ job_title: jobTitle, messages: interviewHistory.slice() });
    interviewHistory.push({ role: "assistant", content: answer });
    saveState();
  } catch (e) {
  } finally {
    button.disabled = false;
    button.textContent = "发送回答";
  }
}

// 结束面试：把整场对话交给 AI 生成总结报告卡片
async function endInterview() {
  if (!started || interviewHistory.length === 0) {
    alert("面试还没开始");
    return;
  }
  // 必须实际回答过至少一题才能生成报告，防止 AI 对空回答编造评分。
  // 注意：开始面试时 history 里会有一条"面试开始"的开场 user 消息，不能靠消息内容判断，
  // 用 answeredCount 计数器（只在真正点击发送回答时累加）才是可靠的依据
  if (answeredCount === 0) {
    alert("你还没有回答任何问题，请至少回答一道题目后再结束面试");
    return;
  }
  const endButton = document.getElementById("end-button");
  endButton.disabled = true;
  endButton.textContent = "生成报告中……";
  addBubble("面试结束，正在生成总结报告……", "ai");
  try {
    const data = await api("/interview-summary", "POST", { job_title: jobTitle, messages: interviewHistory.slice() });
    document.getElementById("report-score").textContent = data.score;
    document.getElementById("report-strengths").textContent = data.strengths;
    document.getElementById("report-weaknesses").textContent = data.weaknesses;
    document.getElementById("report-advice").textContent = data.advice;
    document.getElementById("interview-report").classList.remove("d-none");
    document.getElementById("interview-report").scrollIntoView({ behavior: "smooth" });
  } catch (e) {
    addBubble("生成报告失败：" + e.message, "ai");
  } finally {
    endButton.disabled = false;
    endButton.textContent = "结束面试并生成报告";
  }
}

// 弹出"请先登录"提示框
function showLoginModal() {
  const el = document.getElementById("login-required-modal");
  bootstrap.Modal.getOrCreateInstance(el).show();
}

// 页面加载时恢复整场面试：进行中的面试会重新画出全部气泡（开场消息除外）；
// 若最后一条是用户消息（面试官点评/追问还没返回就被切走），自动重新请求续上
function restoreInterview() {
  loadState();
  if (!started || interviewHistory.length === 0) return;
  const area = document.getElementById("interview-area");
  area.innerHTML = "";
  document.getElementById("job-title").value = jobTitle;
  addBubble("面试开始：你应聘的是「" + jobTitle + "」岗位（历史会话已恢复）。", "ai");
  interviewHistory.forEach(function (m) {
    if (!m || typeof m.content !== "string" || !m.content) return;
    if (m.role === "user" && m.content === OPENING) return;
    addBubble(m.content, m.role === "user" ? "user" : "ai");
  });
  const last = interviewHistory[interviewHistory.length - 1];
  if (last.role === "user" && isLoggedIn()) {
    resumeInterview();
  }
}

// 续答：带着完整历史重新请求流式接口，面试官接着完成上次没答完的点评/追问
async function resumeInterview() {
  const button = document.getElementById("send-button");
  button.disabled = true;
  button.textContent = "面试官思考中……";
  try {
    const answer = await askInterviewStream({ job_title: jobTitle, messages: interviewHistory.slice() });
    interviewHistory.push({ role: "assistant", content: answer });
    saveState();
  } catch (e) {
  } finally {
    button.disabled = false;
    button.textContent = "发送回答";
  }
}

// 页面打开时恢复历史面试（导航登录态由 common.js 末尾的 showUser() 恢复）
restoreInterview();
</script>
</body>
</html>
