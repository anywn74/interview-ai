<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 - AI 智能面试助手</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">AI 智能面试助手</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="展开导航">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="main-nav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="/">AI 问答</a></li>
        <li class="nav-item"><a class="nav-link" href="/interview">模拟面试</a></li>
        <li class="nav-item"><a class="nav-link" href="/bank">题库</a></li>
        <li class="nav-item"><a class="nav-link" href="/bank/new">添加题目</a></li>
        <li class="nav-item"><a class="nav-link" href="/quiz">模拟测试</a></li>
        <li class="nav-item" id="nav-stats"><a class="nav-link" href="/stats">统计</a></li>
        <li class="nav-item" id="nav-records"><a class="nav-link" href="/records">答题记录</a></li>
        <li class="nav-item" id="nav-profile"><a class="nav-link" href="/profile">个人中心</a></li>
      </ul>
      <a class="btn btn-outline-light btn-sm me-2 mt-2 mt-lg-0" id="nav-login" href="/login">登录</a>
      <a class="btn btn-light btn-sm me-2 mt-2 mt-lg-0" id="nav-register" href="/register">注册</a>
      <span class="navbar-text me-2" id="user-info">未登录</span>
      <button class="btn btn-outline-danger btn-sm mt-2 mt-lg-0" id="nav-logout" onclick="logout()">登出</button>
    </div>
  </div>
</nav>

<div class="container py-4" style="max-width: 480px;">
  <div class="card">
    <div class="card-header">登录</div>
    <div class="card-body">
      <div class="mb-3">
        <label class="form-label">用户名</label>
        <input id="username" class="form-control" placeholder="输入用户名" onkeydown="if(event.key==='Enter'){doLogin();}">
      </div>
      <div class="mb-3">
        <label class="form-label">密码</label>
        <input id="password" type="password" class="form-control" placeholder="输入密码" onkeydown="if(event.key==='Enter'){doLogin();}">
      </div>
      <button id="login-button" class="btn btn-primary w-100" onclick="doLogin()">登录</button>
      <div id="login-tip" class="alert alert-warning d-none mt-3 mb-0"></div>
      <p class="text-center text-muted small mt-3 mb-0">还没有账号？<a href="/register">去注册</a></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/common.js"></script>
<script>
// 提交登录：成功后保存用户信息并跳回主页，失败在页面内提示
async function doLogin() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const tip = document.getElementById("login-tip");
  const button = document.getElementById("login-button");
  if (username === "" || password === "") {
    tip.className = "alert alert-warning mt-3 mb-0";
    tip.textContent = "用户名和密码都不能为空";
    return;
  }
  if (button.disabled) return; // 登录请求进行中，防止重复提交
  button.disabled = true;
  button.textContent = "登录中……";
  try {
    const data = await api("/login", "POST", { username: username, password: password });
    saveUser(data.id, username);
    location.href = "/";
  } catch (e) {
    tip.className = "alert alert-danger mt-3 mb-0";
    tip.textContent = "登录失败：" + e.message;
    button.disabled = false;
    button.textContent = "登录";
  }
}
</script>
</body>
</html>
