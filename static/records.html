<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>答题记录 - AI 智能面试助手</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">AI 智能面试助手</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="展开导航">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="main-nav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="/">AI 问答</a></li>
        <li class="nav-item"><a class="nav-link" href="/interview">模拟面试</a></li>
        <li class="nav-item"><a class="nav-link" href="/bank">题库</a></li>
        <li class="nav-item"><a class="nav-link" href="/bank/new">添加题目</a></li>
        <li class="nav-item"><a class="nav-link" href="/quiz">模拟测试</a></li>
        <li class="nav-item" id="nav-stats"><a class="nav-link" href="/stats">统计</a></li>
        <li class="nav-item" id="nav-records"><a class="nav-link active" href="/records">答题记录</a></li>
        <li class="nav-item" id="nav-profile"><a class="nav-link" href="/profile">个人中心</a></li>
      </ul>
      <a class="btn btn-outline-light btn-sm me-2 mt-2 mt-lg-0" id="nav-login" href="/login">登录</a>
      <a class="btn btn-light btn-sm me-2 mt-2 mt-lg-0" id="nav-register" href="/register">注册</a>
      <span class="navbar-text me-2" id="user-info">未登录</span>
      <button class="btn btn-outline-danger btn-sm mt-2 mt-lg-0" id="nav-logout" onclick="logout()">登出</button>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="row mb-3" id="record-summary">
    <div class="col-4">
      <div class="card text-white bg-primary">
        <div class="card-body text-center py-2">
          <div class="fs-4" id="sum-total">-</div>
          <div class="small">总答题数</div>
        </div>
      </div>
    </div>
    <div class="col-4">
      <div class="card text-white bg-success">
        <div class="card-body text-center py-2">
          <div class="fs-4" id="sum-correct">-</div>
          <div class="small">答对题数</div>
        </div>
      </div>
    </div>
    <div class="col-4">
      <div class="card text-dark bg-info">
        <div class="card-body text-center py-2">
          <div class="fs-4" id="sum-rate">-</div>
          <div class="small">正确率</div>
        </div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>答题记录</span>
      <div>
        <button id="btn-all" class="btn btn-sm btn-primary" onclick="loadRecords(0)">全部</button>
        <button id="btn-wrong" class="btn btn-sm btn-outline-danger" onclick="loadRecords(1)">仅错题</button>
      </div>
    </div>
    <div class="card-body">
      <div id="record-list">加载中……</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/common.js"></script>
<script>
// 从 /api/stats 拉取总体数据，填充页面顶部三张统计卡片
async function loadSummary() {
  try {
    // 已登录时只拉取当前用户的统计数据
    const user = currentUser();
    let url = "/api/stats";
    if (user) url = "/api/stats?user_id=" + user.id;
    const data = await api(url, "GET");
    const rate = Math.round(data.correct_rate * 10000) / 100;
    document.getElementById("sum-total").textContent = data.total;
    document.getElementById("sum-correct").textContent = data.correct;
    document.getElementById("sum-rate").textContent = rate + "%";
  } catch (e) {
    // 概览加载失败不影响下面的记录列表
  }
}

// 拉取答题记录并渲染；wrong=1 时只显示错题
async function loadRecords(wrong) {
  const container = document.getElementById("record-list");
  const btnAll = document.getElementById("btn-all");
  const btnWrong = document.getElementById("btn-wrong");
  btnAll.className = "btn btn-sm " + (wrong ? "btn-outline-primary" : "btn-primary");
  btnWrong.className = "btn btn-sm " + (wrong ? "btn-danger" : "btn-outline-danger");
  container.textContent = "加载中……";
  try {
    // 已登录时只拉取当前用户的答题记录
    const user = currentUser();
    let url = "/api/records" + (user ? "?user_id=" + user.id : "");
    if (wrong) url += (user ? "&" : "?") + "wrong=1";
    const records = await api(url, "GET");
    if (records.length === 0) {
      container.textContent = "暂无答题记录";
      return;
    }
    container.textContent = "";
    records.forEach(function (r) {
      const item = document.createElement("div");
      item.className = "card mb-2";
      const body = document.createElement("div");
      body.className = "card-body py-2";

      const headP = document.createElement("p");
      headP.className = "mb-1";
      const titleSpan = document.createElement("strong");
      titleSpan.textContent = r.question_title;
      const badge = document.createElement("span");
      badge.className = "badge ms-2 " + (r.correct === 1 ? "bg-success" : "bg-danger");
      badge.textContent = r.correct === 1 ? "正确" : "错误";
      headP.appendChild(titleSpan);
      headP.appendChild(badge);
      body.appendChild(headP);

      const myP = document.createElement("p");
      myP.className = "mb-1 small text-muted";
      myP.textContent = "我的答案：" + r.user_answer;
      body.appendChild(myP);

      const scoreP = document.createElement("p");
      scoreP.className = "mb-1 small";
      scoreP.textContent = "AI 评分：" + r.score;
      body.appendChild(scoreP);

      const commentP = document.createElement("p");
      commentP.className = "mb-0 small";
      commentP.textContent = "AI 点评：" + r.comment;
      body.appendChild(commentP);

      item.appendChild(body);
      container.appendChild(item);
    });
  } catch (e) {
    container.textContent = "加载失败：" + e.message;
  }
}

// 答题记录页展示个人作答数据，未登录时跳转到登录页
requireAuth();
if (isLoggedIn()) {
  loadSummary();
  loadRecords(0);
}
</script>
</body>
</html>
